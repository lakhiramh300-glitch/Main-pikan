<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1,
      maximum-scale=1,
      user-scalable=no,
      viewport-fit=cover">

<meta name="theme-color" content="#07030f">

<title>MAHI AI • Live Voice</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
  background:#07030f;
  color:#fff;
}

body{
  position:relative;
  background:
    radial-gradient(circle at 50% 25%,#4b1775 0%,#1b082c 35%,#07030f 78%);
}

/* BACKGROUND */

.bg{
  position:absolute;
  inset:0;
  overflow:hidden;
  pointer-events:none;
}

.glow{
  position:absolute;
  width:280px;
  height:280px;
  border-radius:50%;
  background:#b72cff;
  filter:blur(100px);
  opacity:.16;
  left:50%;
  top:40%;
  transform:translate(-50%,-50%);
}

.star{
  position:absolute;
  width:3px;
  height:3px;
  border-radius:50%;
  background:white;
  opacity:.7;
  animation:twinkle 2s infinite alternate;
}

@keyframes twinkle{
  from{opacity:.15;transform:scale(.7)}
  to{opacity:1;transform:scale(1.4)}
}

/* MOON */

.moon{
  position:absolute;
  right:-28px;
  top:125px;
  width:105px;
  height:105px;
  border-radius:50%;
  background:
    radial-gradient(circle at 30% 30%,#fff,#ddd3ff 60%,#b99fff);
  box-shadow:
    0 0 25px #e8dcff,
    0 0 60px rgba(220,190,255,.4);
}

/* HEADER */

.header{
  position:relative;
  z-index:10;
  height:90px;
  display:flex;
  align-items:center;
  gap:13px;
  padding:17px 18px 8px;
}

.logo{
  width:55px;
  height:55px;
  flex-shrink:0;
  border-radius:17px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:31px;
  font-weight:bold;
  background:linear-gradient(135deg,#a936ff,#ed38a9);
  box-shadow:0 0 30px rgba(215,42,255,.5);
}

.brand h1{
  font-size:21px;
  letter-spacing:6px;
}

.brand p{
  margin-top:5px;
  color:#aaa0b5;
  font-size:9px;
  letter-spacing:1.2px;
}

/* STATUS */

.status{
  position:absolute;
  z-index:20;
  right:13px;
  top:25px;
  padding:9px 12px;
  border-radius:20px;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.08);
  backdrop-filter:blur(12px);
  font-size:9px;
  font-weight:bold;
  color:#ff66bd;
}

.status-dot{
  display:inline-block;
  width:8px;
  height:8px;
  border-radius:50%;
  margin-right:6px;
  background:#ff477e;
}

.status.connected{
  color:#55efb0;
}

.status.connected .status-dot{
  background:#2ff0a0;
  box-shadow:0 0 12px #2ff0a0;
}

.status.connecting{
  color:#ffd75a;
}

.status.connecting .status-dot{
  background:#ffd75a;
  box-shadow:0 0 12px #ffd75a;
}

/* CONNECTION */

.connection{
  position:relative;
  z-index:8;
  text-align:center;
  margin-top:10px;
  color:#ff60bd;
  font-size:11px;
  font-weight:bold;
  letter-spacing:3px;
}

/* GIRL */

.girl-area{
  position:absolute;
  z-index:5;
  left:50%;
  top:51%;
  width:350px;
  max-width:94vw;
  transform:translate(-50%,-48%);
  text-align:center;
}

.girl-glow{
  position:absolute;
  left:50%;
  top:110px;
  width:300px;
  height:330px;
  transform:translateX(-50%);
  border-radius:50%;
  background:rgba(174,42,255,.16);
  filter:blur(35px);
}

.girl{
  position:relative;
  width:300px;
  height:500px;
  margin:auto;
}

/* HAIR */

.hair{
  position:absolute;
  left:24px;
  top:80px;
  width:252px;
  height:370px;
  border-radius:110px 110px 70px 70px;
  background:linear-gradient(135deg,#7027b9,#28104f);
  box-shadow:
    0 0 25px rgba(150,40,255,.35),
    inset -20px 0 30px rgba(220,50,180,.15);
}

/* FACE */

.face{
  position:absolute;
  z-index:2;
  left:55px;
  top:105px;
  width:190px;
  height:235px;
  border-radius:48% 48% 47% 47%;
  background:#fff0f6;
  box-shadow:0 0 25px rgba(255,220,245,.35);
}

/* FRINGE */

.fringe{
  position:absolute;
  z-index:4;
  left:42px;
  top:70px;
  width:217px;
  height:90px;
  border-radius:60px 60px 30px 30px;
  background:linear-gradient(135deg,#4b1d98,#e22d9c);
}

/* EYES */

.eye{
  position:absolute;
  z-index:6;
  top:165px;
  width:43px;
  height:56px;
  border-radius:50%;
  background:linear-gradient(#24105b,#7734bf);
  box-shadow:0 4px 10px rgba(40,0,70,.25);
}

.eye.left{
  left:76px;
}

.eye.right{
  right:76px;
}

.eye:after{
  content:"";
  position:absolute;
  left:10px;
  top:8px;
  width:12px;
  height:15px;
  border-radius:50%;
  background:#fff;
}

.eye:before{
  content:"";
  position:absolute;
  right:8px;
  bottom:9px;
  width:7px;
  height:7px;
  border-radius:50%;
  background:#fff;
}

/* BLUSH */

.blush{
  position:absolute;
  z-index:7;
  top:235px;
  width:40px;
  height:14px;
  border-radius:50%;
  background:#ff6f9f;
  opacity:.4;
  filter:blur(5px);
}

.blush.left{left:52px}
.blush.right{right:52px}

/* MOUTH */

.mouth{
  position:absolute;
  z-index:7;
  left:136px;
  top:265px;
  width:31px;
  height:16px;
  border-bottom:4px solid #df4c90;
  border-radius:50%;
}

/* BODY */

.neck{
  position:absolute;
  z-index:3;
  left:125px;
  top:315px;
  width:50px;
  height:65px;
  background:#fff0f6;
}

.body{
  position:absolute;
  z-index:1;
  left:48px;
  top:325px;
  width:204px;
  height:185px;
  border-radius:42px 42px 25px 25px;
  background:linear-gradient(135deg,#8732ce,#df2aa9);
  box-shadow:0 0 30px rgba(220,40,200,.2);
}

.arm{
  position:absolute;
  z-index:0;
  top:375px;
  width:43px;
  height:125px;
  border-radius:30px;
  background:#8130c5;
}

.arm.left{
  left:17px;
  transform:rotate(10deg);
}

.arm.right{
  right:17px;
  transform:rotate(-10deg);
}

.hand{
  position:absolute;
  z-index:8;
  top:445px;
  width:64px;
  height:39px;
  border-radius:50%;
  background:#ff77b7;
}

.hand.left{
  left:94px;
  transform:rotate(24deg);
}

.hand.right{
  right:94px;
  transform:rotate(-24deg);
}

/* GREETING */

.greeting{
  position:relative;
  z-index:10;
  margin-top:-15px;
  font-size:23px;
  font-weight:bold;
  text-shadow:0 0 15px rgba(255,70,190,.35);
}

.greeting span{
  color:#ff55b5;
}

.instruction{
  position:relative;
  z-index:10;
  margin-top:9px;
  padding:0 15px;
  color:#b5acbd;
  font-size:12px;
}

/* CONTROLS */

.controls{
  position:absolute;
  z-index:50;
  left:0;
  bottom:18px;
  width:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:9px;
  padding:0 10px;
}

.control{
  width:59px;
  height:59px;
  border:none;
  border-radius:21px;
  color:white;
  background:rgba(255,255,255,.065);
  border:1px solid rgba(255,255,255,.09);
  backdrop-filter:blur(15px);
  font-size:23px;
  cursor:pointer;
}

.control:active{
  transform:scale(.92);
}

.mic{
  width:92px;
  height:92px;
  border-radius:32px;
  font-size:39px;
  background:linear-gradient(135deg,#bd36ff,#df2da9);
  box-shadow:
    0 0 30px rgba(220,42,210,.55),
    inset 0 0 20px rgba(255,255,255,.12);
}

.mic.active{
  animation:pulse 1.2s infinite;
}

@keyframes pulse{
  50%{
    transform:scale(1.07);
    box-shadow:0 0 60px rgba(255,55,210,.85);
  }
}

/* TOAST */

.toast{
  position:absolute;
  z-index:100;
  left:20px;
  right:20px;
  bottom:110px;
  padding:14px 16px;
  border-radius:18px;
  text-align:center;
  color:#ffc0e4;
  background:rgba(40,5,38,.94);
  border:1px solid rgba(255,70,190,.3);
  backdrop-filter:blur(15px);
  opacity:0;
  transform:translateY(15px);
  transition:.25s;
  pointer-events:none;
  font-size:13px;
}

.toast.show{
  opacity:1;
  transform:translateY(0);
}

/* SMALL PHONES */

@media(max-height:700px){

  .header{
    height:75px;
    padding-top:10px;
  }

  .logo{
    width:46px;
    height:46px;
    font-size:25px;
  }

  .brand h1{
    font-size:18px;
  }

  .girl-area{
    top:48%;
    transform:translate(-50%,-48%) scale(.73);
  }

  .connection{
    margin-top:0;
  }

  .controls{
    bottom:8px;
  }

  .control{
    width:52px;
    height:52px;
  }

  .mic{
    width:80px;
    height:80px;
  }
}

@media(max-width:360px){

  .status{
    display:none;
  }

  .girl-area{
    transform:translate(-50%,-48%) scale(.68);
  }

  .controls{
    gap:5px;
  }

  .control{
    width:50px;
    height:50px;
  }

  .mic{
    width:76px;
    height:76px;
  }
}
</style>
</head>

<body>

<div class="bg">
  <div class="glow"></div>
</div>

<div class="moon"></div>

<header class="header">

  <div class="logo">M</div>

  <div class="brand">
    <h1>MAHI</h1>
    <p>PREMIUM ANIME AI • LIVE VOICE</p>
  </div>

</header>

<div class="status" id="status">
  <span class="status-dot"></span>
  <span id="statusText">OFFLINE</span>
</div>

<div class="connection" id="connection">
  READY
</div>


<div class="girl-area">

  <div class="girl-glow"></div>

  <div class="girl">

    <div class="hair"></div>

    <div class="face"></div>

    <div class="fringe"></div>

    <div class="eye left"></div>
    <div class="eye right"></div>

    <div class="blush left"></div>
    <div class="blush right"></div>

    <div class="mouth"></div>

    <div class="neck"></div>

    <div class="body"></div>

    <div class="arm left"></div>
    <div class="arm right"></div>

    <div class="hand left"></div>
    <div class="hand right"></div>

  </div>

  <div class="greeting">
    Hi Jaan <span>♥</span>
  </div>

  <div class="instruction">
    Main MAHI hoon — mic dabao aur mujhse baat karo ✨
  </div>

</div>


<div class="toast" id="toast"></div>


<div class="controls">

  <button class="control" id="settingsBtn">⚙️</button>

  <button class="control" id="chatBtn">💬</button>

  <button class="control mic" id="micBtn">🎙️</button>

  <button class="control" id="stopBtn">⏹️</button>

  <button class="control" id="loveBtn">💗</button>

</div>


<script type="module">

import { Conversation }
from "https://esm.sh/@elevenlabs/client";


/*
========================================================
 MAHI AI FRONTEND
========================================================

IMPORTANT:
ElevenLabs API KEY यहाँ नहीं रखनी है.

API KEY केवल backend .env में रहेगी.

Backend endpoint:
GET /api/get-signed-url
========================================================
*/


/*
========================================================
 BACKEND URL
========================================================

LOCAL TEST:

http://localhost:3001

अगर आपका backend किसी online server पर है,
तो नीचे localhost की जगह उसका URL डालें.

Example:

https://mahi-backend.onrender.com

========================================================
*/

const BACKEND_URL =
  "http://localhost:3001";


const SIGNED_URL_ENDPOINT =
  BACKEND_URL + "/api/get-signed-url";


/* ELEMENTS */

const micBtn =
  document.getElementById("micBtn");

const stopBtn =
  document.getElementById("stopBtn");

const status =
  document.getElementById("status");

const statusText =
  document.getElementById("statusText");

const connection =
  document.getElementById("connection");

const toast =
  document.getElementById("toast");

const settingsBtn =
  document.getElementById("settingsBtn");

const chatBtn =
  document.getElementById("chatBtn");

const loveBtn =
  document.getElementById("loveBtn");


let conversation = null;
let connecting = false;


/* STARS */

const bg =
  document.querySelector(".bg");

for(let i=0;i<90;i++){

  const star =
    document.createElement("div");

  star.className = "star";

  star.style.left =
    Math.random()*100 + "%";

  star.style.top =
    Math.random()*100 + "%";

  star.style.animationDelay =
    Math.random()*3 + "s";

  bg.appendChild(star);
}


/* STATUS */

function setStatus(type,text){

  status.className = "status";

  if(type){
    status.classList.add(type);
  }

  statusText.textContent = text;
}


/* TOAST */

function showToast(message){

  toast.textContent = message;

  toast.classList.add("show");

  clearTimeout(window.toastTimer);

  window.toastTimer =
    setTimeout(()=>{
      toast.classList.remove("show");
    },4000);
}


/* GET SIGNED URL */

async function getSignedUrl(){

  console.log(
    "MAHI →",
    SIGNED_URL_ENDPOINT
  );

  const response =
    await fetch(
      SIGNED_URL_ENDPOINT,
      {
        method:"GET",
        headers:{
          "Accept":"application/json"
        }
      }
    );


  const text =
    await response.text();


  let data;

  try{

    data =
      JSON.parse(text);

  }catch(e){

    throw new Error(
      "Backend JSON नहीं भेज रहा है."
    );

  }


  if(!response.ok){

    throw new Error(
      data.error ||
      "Backend error: " +
      response.status
    );

  }


  if(
    !data.success ||
    !data.signedUrl
  ){

    throw new Error(
      data.error ||
      "Signed URL नहीं मिला."
    );

  }


  return data.signedUrl;
}


/* START */

async function startMahi(){

  if(connecting){
    return;
  }

  if(conversation){
    return;
  }

  connecting = true;

  micBtn.classList.add("active");

  setStatus(
    "connecting",
    "CONNECTING"
  );

  connection.textContent =
    "CONNECTING TO MAHI...";


  try{

    /* MICROPHONE */

    if(
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ){

      throw new Error(
        "इस browser में microphone support नहीं है."
      );

    }


    await navigator.mediaDevices
      .getUserMedia({
        audio:true
      });


    /* SIGNED URL */

    const signedUrl =
      await getSignedUrl();


    console.log(
      "Signed URL received ❤️"
    );


    /* ELEVENLABS */

    conversation =
      await Conversation.startSession({

        signedUrl:signedUrl,


        onConnect:()=>{

          console.log(
            "MAHI CONNECTED ❤️"
          );

          setStatus(
            "connected",
            "ONLINE"
          );

          connection.textContent =
            "MAHI IS LISTENING ❤️";

        },


        onDisconnect:()=>{

          console.log(
            "MAHI DISCONNECTED"
          );

          conversation =
            null;

          micBtn.classList
            .remove("active");

          setStatus(
            "",
            "OFFLINE"
          );

          connection.textContent =
            "READY";

        },


        onError:(error)=>{

          console.error(
            "ElevenLabs:",
            error
          );

          conversation =
            null;

          micBtn.classList
            .remove("active");

          setStatus(
            "",
            "ERROR"
          );

          connection.textContent =
            "CONNECTION ERROR";

          showToast(
            error?.message ||
            "ElevenLabs connection failed"
          );

        },


        onModeChange:(mode)=>{

          console.log(
            "Mode:",
            mode
          );

          if(
            mode &&
            mode.mode === "speaking"
          ){

            connection.textContent =
              "MAHI IS SPEAKING 💕";

          }else{

            connection.textContent =
              "MAHI IS LISTENING ❤️";

          }

        }

      });


  }catch(error){

    console.error(
      "MAHI ERROR:",
      error
    );

    conversation =
      null;

    micBtn.classList
      .remove("active");

    setStatus(
      "",
      "ERROR"
    );

    connection.textContent =
      "CONNECTION ERROR";


    showToast(
      error?.message ||
      "Failed to connect"
    );

  }


  connecting = false;
}


/* STOP */

async function stopMahi(){

  try{

    if(conversation){

      await conversation
        .endSession();

    }

  }catch(error){

    console.error(
      "Stop error:",
      error
    );

  }


  conversation = null;

  micBtn.classList
    .remove("active");

  setStatus(
    "",
    "OFFLINE"
  );

  connection.textContent =
    "READY";
}


/* MIC */

micBtn.addEventListener(
  "click",
  startMahi
);


/* STOP */

stopBtn.addEventListener(
  "click",
  stopMahi
);


/* SETTINGS */

settingsBtn.addEventListener(
  "click",
  ()=>{
    showToast(
      "MAHI Settings ⚙️"
    );
  }
);


/* CHAT */

chatBtn.addEventListener(
  "click",
  ()=>{
    showToast(
      "Jaan, voice chat के लिए mic दबाओ 💕"
    );
  }
);


/* LOVE */

loveBtn.addEventListener(
  "click",
  ()=>{
    showToast(
      "MAHI: Love you Jaan ❤️"
    );
  }
);


/* INITIAL */

setStatus(
  "",
  "OFFLINE"
);

</script>

</body>
</html>const BACKEND_URL = "http://localhost:3001";

const SIGNED_URL_ENDPOINT =
  BACKEND_URL + "/api/get-signed-url";
